<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <main class="container">
        <form>
            <h1> login Senac </h1>
            <div class="inputbox">
                <input placeholder="Usuario" type="email">
                <i class="bx bxs-user"></i>
            </div>
            <div class="inputbox">
                <input placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="esqueci-a-senha">
                <label>
                    <input type="checkbox">
                    lembrar minha Senha
                </label>
                <a href="#">Esqueci minha Senha</a>
            </div>
          <button type="button" class="btn-login" onclick="window.location.href='Dasboard.html'">login</button>
            <div>
                <p>Não tem uma conta <a href="#">Cadastre-se</a></p>
            </div>
        </form>

        <div class="logo-panel">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/86/Senac_logo.svg" alt="Senac" class="logo">
            <h2>Excelência na<br>Educação Profissional</h2>
            <p class="paragrafo">Transformando vidas através do conhecimento e preparando você para os desafios do mercado global.</p>
        </div>
    </main>
</body>
</html>
